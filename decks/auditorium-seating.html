<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Auditorium Seating</title>
    <style>
    :root {
      --bg: #f6f5f1;
      --fg: #1d1d1b;
      --muted: #5e5d57;
      --stage: #e3e0d8;
      --stage-edge: #b5b1a6;
      --screen: #262624;
      --seat: #ffffff;
      --seat-edge: rgb(0 0 0 / 0.28);
      --halo: #ffffff;
      --sat: 62%;
      --tint-a: 84%;
      --tint-b: 73%;
      --label: 36%;
      --label-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161614;
        --fg: #f0efe9;
        --muted: #a8a69e;
        --stage: #2a2926;
        --stage-edge: #4a4842;
        --screen: #e9e7df;
        --seat: #1d1d1b;
        --seat-edge: rgb(255 255 255 / 0.3);
        --halo: #161614;
        --sat: 45%;
        --tint-a: 30%;
        --tint-b: 40%;
        --label: 62%;
        --label-fg: #111110;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161614;
      --fg: #f0efe9;
      --muted: #a8a69e;
      --stage: #2a2926;
      --stage-edge: #4a4842;
      --screen: #e9e7df;
      --seat: #1d1d1b;
      --seat-edge: rgb(255 255 255 / 0.3);
      --halo: #161614;
      --sat: 45%;
      --tint-a: 30%;
      --tint-b: 40%;
      --label: 62%;
      --label-fg: #111110;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header,
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      align-items: baseline;
      justify-content: space-between;
      padding: 16px clamp(16px, 3vw, 40px);
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 40px);
      letter-spacing: -0.01em;
    }
    .sub {
      margin: 4px 0 0;
      font-size: clamp(14px, 1.4vw, 20px);
      color: var(--muted);
    }
    label {
      font-size: 15px;
      color: var(--muted);
    }
    input {
      width: 5.5em;
      padding: 6px 8px;
      margin-left: 6px;
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--stage-edge);
      border-radius: 6px;
    }
    main {
      min-height: 0;
      padding: 0 clamp(8px, 2vw, 24px);
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    footer {
      justify-content: flex-start;
      font-size: 15px;
      color: var(--muted);
    }
    .chip {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .chip i {
      width: 14px;
      height: 14px;
      background: hsl(var(--h) var(--sat) var(--label));
      border-radius: 4px;
    }
    .error {
      font-weight: 600;
      color: #b3261e;
    }
    .slide header label {
      display: none;
    }

    .stage {
      fill: var(--stage);
      stroke: var(--stage-edge);
      stroke-width: 2;
    }
    .screen {
      fill: var(--screen);
    }
    .room-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-anchor: middle;
      fill: var(--muted);
    }
    .bench {
      stroke-width: 20;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .a .bench {
      fill: hsl(var(--h) var(--sat) var(--tint-a));
      stroke: hsl(var(--h) var(--sat) var(--tint-a));
    }
    .b .bench {
      fill: hsl(var(--h) var(--sat) var(--tint-b));
      stroke: hsl(var(--h) var(--sat) var(--tint-b));
    }
    .seat {
      fill: var(--seat);
      stroke: var(--seat-edge);
      stroke-width: 1;
    }
    .num {
      font-size: 15px;
      font-weight: 700;
      dominant-baseline: central;
      text-anchor: middle;
      fill: var(--fg);
      stroke: var(--halo);
      stroke-width: 4px;
      stroke-linejoin: round;
      paint-order: stroke;
    }
    .range rect {
      fill: hsl(var(--h) var(--sat) var(--label));
    }
    .range text {
      font-size: 30px;
      font-weight: 750;
      dominant-baseline: central;
      text-anchor: middle;
      fill: var(--label-fg);
    }
    .team {
      cursor: default;
      transition: opacity 120ms;
    }
    svg.focusing .team:not(.on) {
      opacity: 0.18;
    }
    svg.focusing .team.on .bench {
      fill: hsl(var(--h) 80% 50%);
      stroke: hsl(var(--h) 80% 50%);
    }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Find Your Team's Seats</h1>
        <p class="sub">
          Look for your team number. Left and right are as you face the screen.
        </p>
      </div>
      <label
        >Team
        <input
          aria-label="Highlight a team number"
          id="find"
          inputmode="numeric"
          min="1"
          type="number"
        ></label
      >
    </header>
    <main>
      <svg
        aria-label="Auditorium seating map by team number"
        id="map"
        role="img"
      ></svg>
    </main>
    <footer id="legend"></footer>

    <script>
    "use strict";
    // The room. Edit this block to match the real auditorium; everything else is derived.
    // Units are arbitrary drawing units; only the ratios matter.
    const ROOM = {
      aisle: 44, // width of the two aisles between left, center, and right
      crossAisle: 96, // walkway between the front and back sections
      expectedSeats: 395,
      frontRadius: 2200, // distance from the room's focal point to the front row; larger is flatter
      rowPitch: 32, // row to row
      seatPitch: 24, // seat to seat along a row
      // Seats per row, front row first. Teams are numbered in this order of sections.
      sections: [
        {
          block: "front",
          hue: 205,
          name: "Front left",
          rows: [8, 8, 8, 9, 9, 9],
          side: "left",
        },
        {
          block: "front",
          hue: 150,
          name: "Front center",
          rows: [12, 12, 13, 13, 14, 14],
          side: "center",
        },
        {
          block: "front",
          hue: 30,
          name: "Front right",
          rows: [8, 8, 8, 9, 9, 9],
          side: "right",
        },
        {
          block: "back",
          hue: 265,
          name: "Back left",
          rows: [10, 10, 10, 10, 10, 11],
          side: "left",
        },
        {
          block: "back",
          hue: 340,
          name: "Back center",
          rows: [15, 15, 15, 16, 16, 16],
          side: "center",
        },
        {
          block: "back",
          hue: 95,
          name: "Back right",
          rows: [10, 10, 10, 10, 10, 11],
          side: "right",
        },
      ],
      teams: 65,
    };

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("map");
    const legend = document.getElementById("legend");

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const [k, v] of Object.entries(attrs)) {
        node.setAttribute(k, v);
      }
      if (parent) {
        parent.appendChild(node);
      }
      return node;
    }

    // Radius of each row, by block.
    const frontRows = Math.max(
      ...ROOM.sections
        .filter((s) => s.block === "front")
        .map((s) => s.rows.length)
    );
    function rowRadius(block, i) {
      const front = ROOM.frontRadius + i * ROOM.rowPitch;
      if (block === "front") {
        return front;
      }
      return (
        ROOM.frontRadius +
        (frontRows - 1) * ROOM.rowPitch +
        ROOM.crossAisle +
        i * ROOM.rowPitch
      );
    }

    // One aisle angle for every row, wide enough for the widest center row,
    // so both aisles run as straight lines from front to back.
    let aisleAngle = 0;
    for (const s of ROOM.sections.filter((x) => x.side === "center")) {
      s.rows.forEach((n, i) => {
        const half =
          ((n - 1) / 2) * ROOM.seatPitch + ROOM.seatPitch / 2 + ROOM.aisle / 2;
        aisleAngle = Math.max(aisleAngle, half / rowRadius(s.block, i));
      });
    }

    // Seat positions: one array per row, front row first, each row left to right.
    function rowsOf(section) {
      return section.rows.map((n, i) => {
        const r = rowRadius(section.block, i);
        const arcs = [];
        for (let k = 0; k < n; k += 1) {
          if (section.side === "center") {
            arcs.push((k - (n - 1) / 2) * ROOM.seatPitch);
          } else {
            const fromAisle =
              aisleAngle * r +
              ROOM.aisle / 2 +
              ROOM.seatPitch / 2 +
              k * ROOM.seatPitch;
            arcs.push(section.side === "left" ? -fromAisle : fromAisle);
          }
        }
        arcs.sort((a, b) => a - b);
        return arcs.map((s) => ({
          x: r * Math.sin(s / r),
          y: r * Math.cos(s / r),
        }));
      });
    }

    // Split a row into k contiguous runs, sizes differing by at most one. The spare
    // seats go to the left runs, or to the right runs when fromRight is set.
    function split(row, k, fromRight) {
      const out = [];
      let cursor = 0;
      for (let j = 0; j < k; j += 1) {
        const rank = fromRight ? k - 1 - j : j;
        const size =
          Math.floor(row.length / k) + (rank < row.length % k ? 1 : 0);
        out.push(row.slice(cursor, cursor + size));
        cursor += size;
      }
      return out;
    }

    // Teams per section, proportional to seats (largest remainder).
    function allocate(counts, teams) {
      const total = counts.reduce((a, b) => a + b, 0);
      const exact = counts.map((c) => (c * teams) / total);
      const out = exact.map(Math.floor);
      const order = exact
        .map((e, i) => [e - Math.floor(e), i])
        .sort((a, b) => b[0] - a[0]);
      const remaining = teams - out.reduce((a, b) => a + b, 0);
      for (let k = 0; k < remaining; k += 1) {
        out[order[k][1]] += 1;
      }
      return out;
    }

    // Rows pair up front to back. Teams are allocated across every pair in the room
    // at once, which keeps team sizes within a seat or so of each other.
    const sections = ROOM.sections.map((s) => {
      const seatRows = rowsOf(s);
      const pairs = [];
      for (let i = 0; i < seatRows.length; i += 2) {
        pairs.push(seatRows.slice(i, i + 2));
      }
      return { ...s, pairs, seatRows, seats: seatRows.flat() };
    });
    const totalSeats = sections.reduce((a, s) => a + s.seats.length, 0);
    const allPairs = sections.flatMap((s) => s.pairs);
    const perPairAll = allocate(
      allPairs.map((p) => p.flat().length),
      ROOM.teams
    );

    const box = {
      x0: Number.POSITIVE_INFINITY,
      x1: Number.NEGATIVE_INFINITY,
      y0: Number.POSITIVE_INFINITY,
      y1: Number.NEGATIVE_INFINITY,
    };
    function grow(x, y, pad = 0) {
      box.x0 = Math.min(box.x0, x - pad);
      box.y0 = Math.min(box.y0, y - pad);
      box.x1 = Math.max(box.x1, x + pad);
      box.y1 = Math.max(box.y1, y + pad);
    }

    // Stage and screen, above the front row.
    const stageEdge = ROOM.frontRadius - 80;
    const sx = 420;
    const sy = Math.sqrt(stageEdge ** 2 - sx ** 2);
    const wallY = sy - 120;
    el(
      "path",
      {
        class: "stage",
        d: `M ${-sx} ${wallY} L ${-sx} ${sy} A ${stageEdge} ${stageEdge} 0 0 0 ${sx} ${sy} L ${sx} ${wallY} Z`,
      },
      svg
    );
    el(
      "rect",
      {
        class: "screen",
        height: 12,
        rx: 3,
        width: sx * 1.4,
        x: -sx * 0.7,
        y: wallY - 4,
      },
      svg
    );
    el("text", { class: "room-text", x: 0, y: wallY + 44 }, svg).textContent =
      "SCREEN";
    el(
      "text",
      { class: "room-text", x: 0, y: stageEdge - 30 },
      svg
    ).textContent = "STAGE";
    grow(-sx, wallY - 10, 20);
    grow(sx, stageEdge, 20);

    // Teams. Each row pair splits left to right into blocks two rows deep,
    // so a team sits roughly three wide and two deep.
    let nextTeam = 1;
    const ranges = [];
    let pairIndex = 0;
    for (const section of sections) {
      const perPair = perPairAll.slice(
        pairIndex,
        pairIndex + section.pairs.length
      );
      pairIndex += section.pairs.length;
      const first = nextTeam;
      section.pairs.forEach((pair, pi) => {
        const runs = pair.map((row, ri) => split(row, perPair[pi], ri === 1));
        for (let j = 0; j < perPair[pi]; j += 1) {
          const [front, back = []] = runs.map((r) => r[j]);
          const seats = [...front, ...back];
          const team = nextTeam;
          nextTeam += 1;
          const tint = (j + pi) % 2 ? "b" : "a";
          const g = el(
            "g",
            {
              class: `team ${tint}`,
              "data-team": team,
              style: `--h:${section.hue}`,
            },
            svg
          );
          el("title", {}, g).textContent =
            `Team ${team}, ${section.name.toLowerCase()}`;
          const outline = [...front, ...back.slice().reverse()];
          el(
            "polygon",
            {
              class: "bench",
              points: outline.map((p) => `${p.x},${p.y}`).join(" "),
            },
            g
          );
          for (const p of seats) {
            el("circle", { class: "seat", cx: p.x, cy: p.y, r: 6.5 }, g);
            grow(p.x, p.y, 14);
          }
          const cx = seats.reduce((a, p) => a + p.x, 0) / seats.length;
          const cy = seats.reduce((a, p) => a + p.y, 0) / seats.length;
          el("text", { class: "num", x: cx, y: cy }, g).textContent = team;
        }
      });
      ranges.push({ first, last: nextTeam - 1, section });
    }

    // Section range labels: front sections in the cross aisle, back sections behind the last row.
    for (const { section, first, last } of ranges) {
      const lastRow = section.rows.length - 1;
      const rowSeats = section.seatRows[lastRow];
      const r = rowRadius(section.block, lastRow);
      const mid =
        rowSeats.reduce((a, p) => a + Math.atan2(p.x, p.y), 0) /
        rowSeats.length;
      const rl = section.block === "front" ? r + ROOM.crossAisle / 2 : r + 52;
      const x = rl * Math.sin(mid);
      const y = rl * Math.cos(mid);
      const text = first === last ? `Team ${first}` : `Teams ${first}-${last}`;
      const g = el("g", { class: "range", style: `--h:${section.hue}` }, svg);
      const w = text.length * 17 + 36;
      el("rect", { height: 44, rx: 22, width: w, x: x - w / 2, y: y - 22 }, g);
      el("text", { x, y: y + 1 }, g).textContent = text;
      grow(x - w / 2, y, 24);
      grow(x + w / 2, y, 24);

      const chip = document.createElement("span");
      chip.className = "chip";
      chip.style.setProperty("--h", section.hue);
      chip.innerHTML = `<i></i>${section.name}: ${text.toLowerCase()}`;
      legend.appendChild(chip);
    }

    const count = document.createElement("span");
    count.textContent = `${totalSeats} seats, ${ROOM.teams} teams`;
    if (totalSeats !== ROOM.expectedSeats) {
      count.className = "error";
      count.textContent += ` (expected ${ROOM.expectedSeats} seats: check the row counts)`;
    }
    legend.prepend(count);

    svg.setAttribute(
      "viewBox",
      `${box.x0} ${box.y0} ${box.x1 - box.x0} ${box.y1 - box.y0}`
    );

    // Highlight one team: hover, the input, or ?team=N in the URL.
    const find = document.getElementById("find");
    function focus(team) {
      let hit = false;
      for (const g of svg.querySelectorAll(".team")) {
        const on = String(team) === g.dataset.team;
        g.classList.toggle("on", on);
        hit ||= on;
      }
      svg.classList.toggle("focusing", hit);
    }
    find.addEventListener("input", () => focus(find.value));
    svg.addEventListener("mouseover", (e) => {
      if (find.value) {
        return;
      }
      const g = e.target.closest(".team");
      focus(g ? g.dataset.team : "");
    });
    svg.addEventListener("mouseleave", () => focus(find.value));
    // ?slide hides the team box, for exporting the map as an image.
    const params = new URLSearchParams(location.search);
    document.body.classList.toggle("slide", params.has("slide"));
    const fromUrl = params.get("team");
    if (fromUrl) {
      find.value = fromUrl;
      focus(fromUrl);
    }
    </script>
  </body>
</html>
