# The pull request's title and body get `checkPrText` (`--pr`): the
# commit-message check, since a squash merge turns them into the `main`
# subject and body (the merger deletes from the template's `---` line down),
# plus `Assisted-by: Claude Code` or `Assisted-by: none` above that line
# (#666). A separate workflow from CI so that editing the description re-runs
# only this, not the build.
#
# This is the merge gate, a required check on `main`. guard-gh.mjs and
# check-pr.mjs only warn an agent sooner; this sees every PR, however its
# title or body was written.
name: pr-text

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-text:
    # Dependabot bodies embed upstream release notes.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Title and body arrive through env, never interpolated into the script,
      # so a body is data and cannot become shell.
      - name: Check the PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-commit-message.mjs --pr
