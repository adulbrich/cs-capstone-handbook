version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Without grouping, 15 direct deps produce a PR each. Grouped, a routine
    # week is one PR; majors stay separate because they need a real review.
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
          - "starlight-*"
        update-types:
          - minor
          - patch
      tooling:
        patterns:
          - "@biomejs/*"
          - ultracite
          - lefthook
          - typescript
        update-types:
          - minor
          - patch
      other:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
