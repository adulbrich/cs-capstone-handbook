# Git hooks via lefthook (https://lefthook.dev)
# Install hooks once with: npx lefthook install

pre-commit:
  commands:
    block-student-data:
      # data/ holds rosters, grades, and survey exports with student PII.
      # It is gitignored; this guard makes the protection structural.
      run: |
        files=$(git diff --cached --name-only | grep -E '^data/' || true)
        if [ -n "$files" ]; then
          echo "Blocked: attempting to commit files under data/ (student data):"
          echo "$files"
          exit 1
        fi
    validate-outcomes:
      # The script also reconciles the Canvas rubric TSVs against the pages,
      # so a TSV-only commit must run it too.
      glob: "{src/content/docs/assignments/*.mdx,canvas/assignments/*/*-rubric-details.tsv}"
      run: node scripts/validate-outcomes.mjs
    validate-activities:
      # The script also reconciles the week-by-week schedule's activity links.
      glob: "{src/content/docs/{assignments,activities,guides}/*.mdx,src/content/docs/introduction/series.mdx}"
      run: node scripts/validate-activities.mjs
    validate-downloads:
      glob: "{public/*,src/content/docs/**/*.mdx}"
      run: node scripts/validate-downloads.mjs
    validate-dashes:
      glob: "{src,canvas,public,decks}/**/*"
      run: node scripts/validate-dashes.mjs
    validate-dates:
      glob: "{src/**/*,canvas/**/*,public/**/*,decks/**/*,STAFF-RUNBOOK.md}"
      run: node scripts/validate-dates.mjs
    biome:
      glob: "{scripts/**/*.mjs,src/**/*.{astro,ts,mjs,css},astro.config.mjs,*.json,*.jsonc}"
      run: npx biome check {staged_files}
