# Git hooks via lefthook (https://lefthook.dev)
# npm install installs the hooks through the prepare script; npx lefthook install also works.
# LEFTHOOK=0 or --no-verify skips; CI and the .claude/hooks catch the skip.

pre-commit:
  commands:
    branch:
      # Never commit on main; branch first.
      run: test "$(git branch --show-current)" != main
      fail_text: "never commit on main; branch first (AGENTS.md)"
    prose:
      # No em dash (literal or entity), no emoji, in the staged text files.
      glob: "*.{md,mdx,astro,ts,tsx,js,mjs,cjs,json,jsonc,yml,yaml,css,csv,html,txt,sh}"
      run: node scripts/check-prose.mjs {staged_files}
    block-student-data:
      # data/ holds rosters, grades, and survey exports with student PII.
      # It is gitignored; this guard makes the protection structural.
      run: |
        files=$(git diff --cached --name-only | grep -E '^data/' || true)
        if [ -n "$files" ]; then
          echo "Blocked: attempting to commit files under data/ (student data):"
          echo "$files"
          exit 1
        fi
    validate-outcomes:
      # The script also reconciles the Canvas rubric CSVs against the pages,
      # so a CSV-only commit must run it too.
      glob: "{src/content/docs/assignments/*.mdx,canvas/assignments/*/*-rubric.csv}"
      run: node scripts/validate-outcomes.mjs
    validate-activities:
      # The script also reconciles the week-by-week schedule's activity links.
      glob: "{src/content/docs/{assignments,activities,guides}/*.mdx,src/content/docs/introduction/schedule.mdx}"
      run: node scripts/validate-activities.mjs
    validate-downloads:
      glob: "{public/*,src/content/docs/**/*.mdx}"
      run: node scripts/validate-downloads.mjs
    validate-dashes:
      glob: "{src,canvas,public,decks}/**/*"
      run: node scripts/validate-dashes.mjs
    validate-dates:
      glob: "{src/**/*,canvas/**/*,public/**/*,decks/**/*,STAFF-RUNBOOK.md}"
      run: node scripts/validate-dates.mjs
    validate-sidebar:
      # A duplicate sidebar.order is silent: the build and the link validator
      # both pass and the group renders in an order nobody chose.
      glob: "src/content/docs/**/*.mdx"
      run: node scripts/validate-sidebar.mjs
    validate-sources:
      # A cited source must be in the registry with its claims and locators,
      # and a registry entry must be cited; either file can break the pair.
      glob: "{src/content/docs/**/*.mdx,src/data/sources/*.yaml}"
      run: node scripts/validate-sources.mjs
    biome:
      glob: "{scripts/**/*.mjs,.claude/hooks/*.mjs,src/**/*.{astro,ts,mjs,css},astro.config.mjs,*.json,*.jsonc}"
      run: npx biome check {staged_files}

commit-msg:
  commands:
    message:
      # Conventional subject, lowercase imperative, no em dash, no emoji,
      # never a claude.ai/code/session link.
      run: node scripts/check-commit-message.mjs {1}

pre-push:
  commands:
    # Everything CI runs, once per push rather than once per commit.
    branch:
      # type/slug, issue number first when there is one. The app names a session branch claude/...; rename it.
      run: node scripts/check-branch-name.mjs
    commits:
      run: node scripts/check-commit-message.mjs --range origin/main..HEAD
    prose:
      run: npm run check:prose
    biome:
      run: npm run check
    validate-outcomes:
      run: node scripts/validate-outcomes.mjs
    validate-activities:
      run: node scripts/validate-activities.mjs
    validate-downloads:
      run: node scripts/validate-downloads.mjs
    validate-dashes:
      run: node scripts/validate-dashes.mjs
    validate-dates:
      run: node scripts/validate-dates.mjs
    validate-sidebar:
      run: node scripts/validate-sidebar.mjs
    validate-sources:
      run: node scripts/validate-sources.mjs
    test-hooks:
      run: node scripts/test-guard-git.mjs
    build:
      # astro check + astro build; fails on a broken internal link or anchor.
      # The paste kit reads the built pages, so it runs in the same command.
      run: npm run build && npm run canvas:export -- --strict
