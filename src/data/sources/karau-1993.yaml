authors:
  - Karau, S. J.
  - Williams, K. D.
year: 1993
title: "Social Loafing: A Meta-Analytic Review and Theoretical Integration"
venue: Journal of Personality and Social Psychology
kind: peer-reviewed
url: https://doi.org/10.1037/0022-3514.65.4.681
doi: 10.1037/0022-3514.65.4.681
verified: full-text
claims:
  - claim: >-
      A meta-analysis of 78 studies finds social loafing robust across tasks
      and populations.
    locator: Abstract, p. 681
  - claim: >-
      Individuals are more likely to loaf when the potential for evaluating
      their own contribution is absent.
    locator: p. 696; p. 701
  - claim: >-
      Individuals were generally either unwilling or unable to acknowledge
      that they loafed on collective tasks.
    locator: p. 701
