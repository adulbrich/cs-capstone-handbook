claims:
  - claim: >-
      Git puzzles even experienced developers, and the authors attribute much
      of its difficulty to flaws in its conceptual model.
    locator: Abstract; Sec. 1, Introduction
  - claim: >-
      "Tracked" and "staged" files are subtly different concepts, and a
      tracked file updated after it was added is committed in its older,
      added version.
    locator: Sec. 3, An Overview of Git
