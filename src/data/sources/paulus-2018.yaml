authors:
  - Paulus, P. B.
  - Baruah, J.
  - Kenworthy, J. B.
year: 2018
title: Enhancing Collaborative Ideation in Organizations
venue: Frontiers in Psychology
kind: peer-reviewed
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6204394/
doi: 10.3389/fpsyg.2018.02024
verified: full-text
claims:
  - claim: >-
      Most formal brainstorming sessions use Osborn's rules (focus on
      quantity, say whatever comes to mind, don't criticize shared ideas,
      build on shared ideas), and the best evidence among them is for
      focusing on quantity initially rather than quality.
    locator: Gathering and Preparation; Getting Groups Ready for Effective Collaborative Ideation
  - claim: >-
      The typical cognitive search process taps the most obvious or common
      ideas first; the rarer and more novel ideas surface only later.
    locator: Gathering and Preparation; Getting Groups Ready for Effective Collaborative Ideation
  - claim: >-
      In face-to-face groups only one person can effectively share ideas at a
      time (production blocking), and while waiting to present their ideas
      members may find it difficult to hold them in mind.
    locator: Theoretical Background
  - claim: >-
      Because of production blocking, evaluation apprehension, and downward
      social comparison, groups of four tend to generate only about half as
      many ideas as the same number of individuals brainstorming alone.
    locator: The Use of Different Modalities
  - claim: >-
      Research on passing slips of paper among group members suggests that
      sharing ideas in writing may be a quite effective approach, and in one
      short session the writing procedure yielded twice as many ideas as the
      verbal approach.
    locator: The Use of Different Modalities
  - claim: >-
      Electronic idea exchange tends to generate more ideas than the verbal
      method, but its usefulness for evaluation is in doubt; evaluation is
      better accomplished face to face.
    locator: The Use of Different Modalities
  - claim: >-
      Generating original ideas does not necessarily lead to selecting them,
      because of a feasibility bias in selection, and there is some evidence
      that groups that generate many ideas tend to select less original ones.
    locator: "The Convergent Phase: Evaluation, Selection, and Development"
