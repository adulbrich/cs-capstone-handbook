authors:
  - Collberg, C.
  - Proebsting, T. A.
year: 2016
title: Repeatability in Computer Systems Research
venue: Communications of the ACM
kind: peer-reviewed
url: https://cacm.acm.org/research/repeatability-in-computer-systems-research/
doi: 10.1145/2812803
verified: full-text
claims:
  - claim: >-
      The study examined 601 papers from ACM conferences and journals and
      tried to build the code behind the papers whose results were backed
      by code, where the authors could obtain it, without checking whether
      the published results reproduced.
    locator: Introduction, The study, p. 64; Study Process, p. 65
  - claim: >-
      Of the papers whose results were backed by code, research assistants
      built the code within 30 minutes for 32.3% (weak repeatability A),
      and with "unlimited time" but without the lead developer's help for
      48.3% (weak repeatability B).
    locator: Study Process, p. 65; Study Results, p. 66; Table 2, p. 67
  - claim: >-
      The lead developer was often unavailable for consultation, for
      reasons including the student responsible for development having
      graduated and the authors' email addresses no longer working.
    locator: Study Results, p. 66
