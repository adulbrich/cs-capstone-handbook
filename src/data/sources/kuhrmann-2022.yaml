year: 2022
title: What Makes Agile Software Development Agile?
venue: IEEE Transactions on Software Engineering
kind: peer-reviewed
url: https://ieeexplore.ieee.org/document/9496156
doi: 10.1109/TSE.2021.3099532
# Read in full as the author version on arXiv (2109.11435).
verified: full-text
claims:
  - claim: >-
      In an international survey with 556 data points, only 83 (14.93%)
      implemented all project disciplines consistently agile, consistently
      traditional, or consistently balanced, and the per-discipline
      histograms showed a general tendency toward a hybrid development
      approach rather than a trend toward purely agile or traditional
      development.
    locator: Section 4.2, Figures 8 and 9, Finding 1b
  - claim: >-
      Compared to the selection of methods used, the selection of practices
      used has a stronger effect on the degree of agility of a given
      discipline.
    locator: Section 4.3.1, Finding 2
