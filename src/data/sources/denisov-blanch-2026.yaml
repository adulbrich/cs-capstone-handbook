verified: full-text
claims:
  - claim: >-
      In a staggered difference-in-differences panel of agent-adopting
      repositories, those that adopted an agent as their first AI tool and had
      no committed AI configuration (instruction files, rules, agent
      definitions) showed roughly twice the increase in cognitive complexity
      of those with one (+53% against +27%); the authors caution that the
      comparison is observational and that correlated engineering discipline
      may explain part of the gap.
