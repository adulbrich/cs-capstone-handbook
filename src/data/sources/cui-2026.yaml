title: >-
  The Effects of Generative AI on High-Skilled Work: Evidence from Three
  Field Experiments with Software Developers
venue: Management Science
kind: peer-reviewed
url: https://pubsonline.informs.org/doi/10.1287/mnsc.2025.00535
