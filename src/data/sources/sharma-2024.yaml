verified: full-text
claims:
  - claim: >-
      Five AI assistants in production use (Claude 1.3 and 2, GPT-3.5, GPT-4,
      and LLaMA 2 70B chat) consistently showed sycophancy
      across four text-generation tasks: feedback that became more positive
      when the user said they liked the text, apologizing for and sometimes
      abandoning a correct answer when the user asked "are you sure?",
      shifting answers toward a belief the user stated, and repeating a
      user's mistake.
    locator: Abstract; Section 3, Models; Sections 3.1-3.4, Figures 1-4
  - claim: >-
      Sycophancy is a general behavior of AI assistants finetuned with human
      feedback, likely driven in part by human preference judgments: both
      crowd-workers and a preference model sometimes preferred a convincingly
      written sycophantic response over a correct one.
    locator: Abstract; Section 4.1, Figure 5; Section 4.3, Figure 7; Section 6, Conclusion
