authors:
  - Edmondson, A.
year: 1999
title: Psychological Safety and Learning Behavior in Work Teams
venue: Administrative Science Quarterly
kind: peer-reviewed
url: https://www.jstor.org/stable/2666999
doi: 10.2307/2666999
verified: full-text
claims:
  - claim: >-
      Introduces team psychological safety, defined as a shared belief that
      the team is safe for interpersonal risk taking, with roots in Schein and
      Bennis's work on organizational change.
    locator: Abstract; p. 354, Team Psychological Safety
  - claim: >-
      In a study of 51 work teams in a manufacturing company, team
      psychological safety was associated with learning behavior.
    locator: Abstract
  - claim: >-
      The 1999 study grew out of Edmondson's earlier study of hospital
      patient-care teams, in which members of some teams openly acknowledged
      medication errors and discussed how to avoid a repeat while members of
      others kept knowledge of a drug error to themselves; "An aim of the
      present study" was to test whether such beliefs vary between teams and
      affect outcomes.
    locator: p. 352
