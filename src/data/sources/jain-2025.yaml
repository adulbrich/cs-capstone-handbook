verified: abstract
claims:
  - claim: >-
      On CloudAPIBench, code models struggled with low-frequency APIs (GPT-4o
      achieved only 38.58% valid low-frequency API invocations);
      documentation augmented generation raised that to 47.94%, but with
      sub-optimal retrievers it hurt high-frequency APIs, a 39.02% absolute
      drop.
