verified: full-text
claims:
  - claim: >-
      By 2005 the Google Web Server's releases were becoming buggier, and at
      one point more than 80% of its production pushes contained
      user-affecting bugs that had to be rolled back; its tech lead
      then required tests with all new code changes, run continuously, and
      within a year emergency pushes dropped by half despite a record number
      of changes.
    locator: The Story of Google Web Server
