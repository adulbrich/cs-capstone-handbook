verified: full-text
claims:
  - claim: >-
      An online survey of 319 knowledge workers who use generative AI at work
      at least weekly, who shared 936 first-hand examples of using it in work
      tasks.
    locator: Abstract; Section 3.2; Section 3.3.1, Dataset Cleaning and Overview
  - claim: >-
      Higher task-specific confidence in generative AI was associated with less
      self-reported critical thinking, and higher confidence in doing the task
      oneself with more. The measures are self-reported and the analysis does
      not establish causation.
    locator: >-
      Abstract; Section 4.2.1; Section 5.1.1; Table 4; Section 6.1.1, Self-Confidence
      and Task Confidence; Section 6.3, Limitations
