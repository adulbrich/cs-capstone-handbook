year: 2016
title: Flaky Tests at Google and How We Mitigate Them
venue: Google Testing Blog
kind: essay
url: https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html
# A practitioner's account of Google's own test corpus, cited as that
# account and never as Evidence. The whole post was read.
verified: full-text
claims:
  - claim: >-
      Across Google's test corpus, about 1.5% of all test runs report a flaky
      result, almost 16% of tests have some level of flakiness, and about 84%
      of observed pass-to-fail transitions in post-submit CI involve a flaky
      test.
    locator: Paragraphs 2 to 4
  - claim: >-
      Legitimate failures in flaky tests are commonly ignored because of the
      high number of false positives.
    locator: Paragraph 4
