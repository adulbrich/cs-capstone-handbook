claims:
  - claim: >-
      At Google, the median change modifies 24 lines, about 90% of changes
      modify fewer than 10 files, and the median latency for the whole review
      process is under four hours.
    locator: Sec. 5.2, Quantifying The Review Process
  - claim: >-
      Code review has been a required part of development at Google since
      early in the company's history, and the median change has one reviewer.
    locator: Sec. 1, Introduction; Sec. 5.2
