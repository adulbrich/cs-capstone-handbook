verified: full-text
claims:
  - claim: >-
      Comparing five matched pairs of software products with the same
      function, each built once by a commercial firm and once by an open
      source community, the product from the loosely coupled organization was
      significantly more modular in every pair, measured by how far a change
      in one component could propagate to others.
