authors:
  - MacCormack, A.
  - Baldwin, C.
  - Rusnak, J.
year: 2012
title: >-
  Exploring the Duality between Product and Organizational Architectures: A
  Test of the "Mirroring" Hypothesis
venue: Research Policy
kind: peer-reviewed
url: https://dash.harvard.edu/handle/1/34403525
doi: 10.1016/j.respol.2012.04.011
# Read from the accepted manuscript in Harvard's DASH repository. The
# manuscript's abstract gives the largest difference as a factor of eight and
# the published abstract as six, so the claim states no multiple. The paired
# products are different products of similar function and size, not one
# product built twice; where commercial code was unavailable, the first open
# release stands in for it (Section 4). Pair 4 has two commercial matches, so
# Table 4 has six comparisons, all in the hypothesized direction.
verified: full-text
claims:
  - claim: >-
      Testing the mirroring hypothesis on five matched pairs of software
      products of similar function and size, each pairing a product from a
      tightly coupled organization (usually a commercial firm) with one from a
      loosely coupled open source community, the product from the loosely
      coupled organization was significantly more modular in every pair,
      measured by propagation cost: how far a change in one file could
      propagate to others.
    locator: Abstract; Section 5; Table 4
