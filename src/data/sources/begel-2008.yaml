authors:
  - Begel, A.
  - Simon, B.
year: 2008
title: Struggles of New College Graduates in Their First Software Development Job
venue: >-
  Proceedings of the 39th SIGCSE Technical Symposium on Computer Science
  Education, 226-230
kind: peer-reviewed
url: https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/sigcse-begel-2008.pdf
doi: 10.1145/1352135.1352218
verified: full-text
claims:
  - claim: >-
      An observational study of eight recent college graduates in their first
      six months as software developers at Microsoft, over 85 hours of
      observation.
    locator: Abstract
  - claim: >-
      The new developers got stuck in five ways (communication, collaboration,
      technical, cognition, and orientation), only one of them technical.
    locator: Abstract; Section 1
  - claim: >-
      On communication, the new developers sometimes went into too much detail
      in design meetings, at other times gave too little, and did not push
      for enough detail in the responses they got.
    locator: Section 4.2.1
