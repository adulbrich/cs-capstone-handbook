claims:
  - claim: >-
      Merging into trunk daily, keeping branches alive for less than a day,
      and having fewer than three active branches contributed to higher
      software delivery performance.
    locator: Technical practices, Trunk-based development, p. 40
  - claim: >-
      High performers' branches typically lived for hours and low performers'
      for days, a statistically significant difference.
    locator: Technical practices, p. 41
  - claim: >-
      The report addresses developers used to the GitHub-recommended workflow:
      short-lived branches merged into trunk at least daily are consistent
      with continuous integration.
    locator: Technical practices, Trunk-based development, p. 40
