# Closed access; only the abstract was read, so the claims stay inside it.
verified: abstract
claims:
  - claim: >-
      In data from 468 adults, found no support for the view that the MBTI
      measures dichotomous preferences or distinct types; it measures four
      relatively independent dimensions, which correspond to four of the five
      major dimensions of personality.
